name: Build and Test on Windows

on: push

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Cache Chocolatey packages to speed up choco install
      - name: Cache Chocolatey packages
        uses: actions/cache@v3
        with:
          path: |
            C:\ProgramData\chocolatey\lib
            C:\ProgramData\chocolatey\cache
          key: ${{ runner.os }}-choco-packages

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install C toolchain
        run: choco install mingw -y

      - name: Add mingw to PATH
        shell: pwsh
        run: |
          $mingw = "${Env:ProgramFiles}\mingw-w64\mingw64\bin"
          echo $mingw >> $Env:GITHUB_PATH

      - name: Build all packages
        run: go build -v ./...

      # build and run the example as a separate executable
      - name: Build example executable
        shell: pwsh
        run: go build -o bin\main.exe main.go

      - name: Run example binary
        shell: pwsh
        run: |
          $lib = "${Env:GITHUB_WORKSPACE}\lib"
          $Env:PATH = "$lib;$Env:PATH"
          & .\bin\main.exe

      - name: Upload example artifacts
        uses: actions/upload-artifact@v3
        with:
          name: example-artifacts
          path: |
            bin/main.exe
            lib

  run-only:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download example artifacts
        uses: actions/download-artifact@v3
        with:
          name: example-artifacts

      - name: Run example binary without Go
        shell: pwsh
        run: |
          $lib = "${Env:GITHUB_WORKSPACE}\lib"
          $Env:PATH = "$lib;$Env:PATH"
          & .\bin\main.exe
