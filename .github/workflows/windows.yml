name: Build and Test on Windows

on: push

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install C toolchain
        run: choco install mingw -y

      - name: Add mingw to PATH
        shell: pwsh
        run: |
          $mingw = "$Env:ProgramFiles\mingw-w64\mingw64\bin"
          echo "::add-path::$mingw"

      - name: Build all packages
        run: go build -v ./...

      - name: Run example main.go
        run: go run main.go
